name: DevSecMLOps Security Pipeline

on:
  push:
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  security-pipeline:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train model
        run: |
          PYTHONPATH=02_DEVELOP_BUILD python 02_DEVELOP_BUILD/ml/train.py

      - name: Unit and security tests
        env:
          API_KEY: ci-test-key
          AUTH_REQUIRED: "true"
          RATE_LIMIT_REQUESTS: "1000"
          PYTHONPATH: 02_DEVELOP_BUILD
        run: |
          pytest -q 03_TEST_VERIFY/tests

      - name: SAST — Bandit
        run: |
          bandit -r 02_DEVELOP_BUILD/app -ll -iii

      - name: SCA — pip-audit
        run: |
          pip-audit -r requirements.txt

      - name: Secret scan — Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t secure-email-gateway:${{ github.sha }} .

      - name: Container scan — Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "secure-email-gateway:${{ github.sha }}"
          format: "table"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true

      - name: Start ephemeral API for DAST
        env:
          API_KEY: ci-test-key
          AUTH_REQUIRED: "false"
        run: |
          nohup python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 > /tmp/secure-email-api.log 2>&1 &
          sleep 8
        working-directory: 02_DEVELOP_BUILD

      - name: DAST — OWASP ZAP baseline
        run: |
          docker run --rm --network host \
            -t ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://127.0.0.1:8000/docs \
            -r zap-report.html

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: zap-report
          path: zap-report.html
