services:
  api:
    build: .
    container_name: secure-email-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      API_KEY: ${API_KEY:-change-me-demo-key}
      AUTH_REQUIRED: "true"
      ALLOWED_ORIGINS: "http://localhost:8501,http://127.0.0.1:8501"
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 5

  dashboard:
    build: .
    container_name: secure-email-dashboard
    command: streamlit run 02_DEVELOP_BUILD/dashboard/streamlit_app.py --server.address=0.0.0.0 --server.port=8501
    environment:
      API_BASE_URL: http://api:8000
      API_KEY: ${API_KEY:-change-me-demo-key}
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  prometheus:
    image: prom/prometheus:latest
    container_name: secure-email-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./04_DEPLOY_MONITOR/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      api:
        condition: service_healthy

  grafana:
    image: grafana/grafana:latest
    container_name: secure-email-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin123}
    volumes:
      - ./04_DEPLOY_MONITOR/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./04_DEPLOY_MONITOR/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
